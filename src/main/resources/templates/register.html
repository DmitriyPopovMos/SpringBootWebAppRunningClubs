<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
                                                            <!-- xmlns:th="http://www.thymeleaf.org" - это объявление пространства имён для атрибутов th* в шаблоне Thymeleaf -->
                                                            <!-- xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" - это указание пространства имён для диалекта Thymeleaf Layout, который позволяет создавать макеты и повторно используемые шаблоны -->
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>

<body class="d-flex flex-column h-100"
      style="background-image: url('/image/image.png');
      height: 81%;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover">
<main class="flex-shrink-0">

    <section layout:fragment="body" class="py-5">

        <style>
            .main {
                padding: 0px 10px;
            }

            @media screen and (max-width: 450px) {
                .login-form {
                    margin-top: 10%;
                }

                .register-form {
                    margin-top: 10%;
                }
            }
            @media screen and (min-width: 768px) {
                .main {
                    margin-left: 30%;
                }

                .sidenav {
                    width: 40%;
                    position: fixed;
                    z-index: 1;
                    top: 0;
                    left: 0;
                }
            }
        </style>

        <div class="main">
            <div class="col-md-6 col-sm-12">

                <div th:if="${param.fail}" class="alert alert-success">
                    <b>Username or email already exists!</b>
                </div>

                <div class="login-form">
                    <form method="post" role="form" th:action="@{/register/save}" th:object="${user}">
                        <div class="form-group-1">
                            <label>Username</label>
                            <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Username"
                                    th:field="*{username}">
                        </div>
                        <p th:if="${#fields.hasErrors('username')}" class="text-danger"></p>
                        <div class="form-group-1">
                            <label>Email</label>
                            <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Email"
                                    th:field="*{email}">
                        </div>
                        <p th:if="${#fields.hasErrors('email')}" class="text-danger"></p>
                        <div class="form-group-1">
                            <label>Password</label>
                            <input
                                    type="password"
                                    class="form-control"
                                    placeholder="Password"
                                    th:field="*{password}">
                        </div>
                        <p th:if="${#fields.hasErrors('password')}" class="text-danger"></p>

                        <a class="btn btn-warning" th:href="@{/login}">Login here</a>
                        <button th:href="@{/register}" type="submit" class="btn btn-dark">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

</main>

</body>
</html>
