<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
                                                               <!-- xmlns:th="http://www.thymeleaf.org" - это объявление пространства имён для атрибутов th* в шаблоне Thymeleaf -->
                                                               <!-- xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" - это указание пространства имён для диалекта Thymeleaf Layout, который позволяет создавать макеты и повторно используемые шаблоны -->
<head>
    <meta charset="UTF-8">
    <title>Clubs list</title>
</head>

<body class="d-flex flex-column h-100" style="background-image: url('/image/image.png'); background-position: center; background-repeat: no-repeat; background-size: cover">
<main class="flex-shrink-0">

    <section layout:fragment="body" class="py-5">
        <div class="container px-5 my-5">
            <div th:if="${param.success}" class="alert alert-success">
                You are registered successfully!
            </div>
            <div class="text-center mb-5">
                <h1 class="fw-bolder" style="color: #fff900">Runners Near You</h1>
                <p style="color: black"><b>Runners found in your area</b></p>
            </div>
            <div class="row gx-5">
                <div>
                    <form th:action="@{/clubs/search}" class="form-inline my-2 my-lg-0 mb-3">
                        <button type="submit" class="btn btn-dark">Search</button>
                        <input name="query"
                               class="form-control mr-sm-2 mb-5"
                               type="search"
                               placeholder="Search running clubs"
                               aria-label="Search">
                    </form>
                </div>

                <div th:each="club : ${clubs}" class="col-lg-6 mb-0">
                    <span>
                        <a class="btn btn-warning" th:href="@{/clubs/{id}(id=${club.id})}">View</a>
                    </span>
                    <span th:if="${user.id} == ${club.createdBy.id}">        <!-- Проверка совпадают ли user.id и club.createdBy.id -->
                        <a class="btn btn-dark" th:href="@{/clubs/update/{id}(id=${club.id})}">Edit</a>
                    </span>

                    <div class="position-relative mb-3">
                        <p>
                        <a th:text="${club.title}" class="h3 fw-bolder text-decoration-none link-dark stretched-link" href="#!">Project name</a>
                        </p>
                        <img class="img-fluid rounded-3 mb-3" th:src="${club.photoUrl}" alt="..." width="400"/>
                    </div>
                </div>
            </div>
        </div>
    </section>

</main>

</body>
</html>
