<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
                                    <!-- xmlns:th="http://www.thymeleaf.org" - это объявление пространства имён для атрибутов th* в шаблоне Thymeleaf -->
                                    <!-- xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" - это указание пространства имён для диалекта Thymeleaf Layout, который позволяет создавать макеты и повторно используемые шаблоны -->
<head>
    <meta charset="UTF-8">
    <title>Clubs Update</title>
</head>

<body class="d-flex flex-column h-100" style="background-image: url('/image/image.png'); background-position: center; background-repeat: no-repeat; background-size: cover">
<main class="flex-shrink-0">

    <section layout:fragment="body" class="py-5">
        <div class="container">
            <form role="form" th:action="@{/clubs/update}" th:object="${club}" method="post">
                <div class="form-row">
                    <div class="form-group col-md-6">
<!--                        <label for="inputId"><b>Id</b></label>-->
                        <input
                                type="hidden"
                                class="form-control"
                                id="inputId"
                                name="id"
                                th:field="*{id}"
                                placeholder="Id"
                                readonly>
                    </div>
                    <div class="form-group col-md-6">
<!--                        <label for="inputCreatedOn"><b>CreatedOn</b></label>-->
                        <input
                                type="hidden"
                                class="form-control"
                                id="inputCreatedOn"
                                name="createdOn"
                                th:field="*{createdOn}"
                                placeholder="CreatedOn"
                                readonly>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="inputTitle"><b>Title</b></label>
                        <input
                                type="text"
                                class="form-control"
                                id="inputTitle"
                                name="title"
                                th:field="*{title}"
                                placeholder="Title">
                        <p th:if="${#fields.hasErrors('title')}" class="text-danger" th:errors="*{title}"></p>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="inputPhotoUrl"><b>PhotoUrl</b></label>
                        <input
                                type="text"
                                class="form-control"
                                id="inputPhotoUrl"
                                name="photoUrl"
                                th:field="*{photoUrl}"
                                placeholder="PhotoUrl">
                        <p th:if="${#fields.hasErrors('photoUrl')}" class="text-danger" th:errors="*{photoUrl}"></p>
                    </div>

                    <div class="form-group col-md-6">
                        <label for="inputContent"><b>Content</b></label>
                        <textarea class="form-control-1"
                                  id="inputContent"
                                  rows="10"
                                  cols="85"
                                  type="text"
                                  th:field="*{content}"
                                  placeholder="Content">
                        </textarea>
                        <p th:if="${#fields.hasErrors('content')}" class="text-danger" th:errors="*{content}"></p>
                    </div>
                </div>
                <br>
                <button type="submit" class="btn btn-warning">Update</button>
            </form>
        </div>
    </section>

</main>

</body>
</html>
